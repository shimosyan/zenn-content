name: Pull Request

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # デプロイしないため PR レベルの排他制御
  cancel-in-progress: true # PR の更新があった場合は前のジョブをキャンセルする

permissions: {}

jobs:
  status-check:
    needs:
      - document-test
      - update-aqua-checksums
      - update-actions-lock
    runs-on: ubuntu-latest
    permissions: {}

    if: failure()
    steps:
      - run: exit 1

  document-test:
    uses: shimosyan/.github/.github/workflows/wc-document-pull-request.yaml@bc3ed1de3b27f64e0adef836c21a808ce44624fc # main
    with:
      enable_textlint: true
      comment_key: common
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write

  update-aqua-checksums:
    uses: shimosyan/.github/.github/workflows/wc-update-aqua-checksums.yaml@bc3ed1de3b27f64e0adef836c21a808ce44624fc # main
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write

  update-actions-lock:
    uses: shimosyan/.github/.github/workflows/wc-update-actions-lock.yaml@bc3ed1de3b27f64e0adef836c21a808ce44624fc # main
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write
